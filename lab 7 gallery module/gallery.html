<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gallery | PLD</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HEADER -->
<header class="bg-dark text-white text-center p-3">
  <h1>Gallery</h1>
</header>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
  <div class="container">
    <a class="navbar-brand" href="#">PLD</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="dashboard.html">Dashboard</a>
        <a class="nav-link" href="profile.html">Profile</a>
        <a class="nav-link active" href="gallery.html">Gallery</a>
      </div>
    </div>
  </div>
</nav>

<!-- GALLERY GRID -->
<main class="container mt-4">
  <div class="row g-4">

    <!-- IMAGE 1 -->
    <div class="col-12 col-sm-6 col-md-4">
      <div class="card gallery-card" data-bs-toggle="modal" data-bs-target="#img1">
        <img src="images/gallery1.jpg" class="card-img-top" alt="Gallery Image 1">
        <div class="card-body text-center">
          <p class="card-text">HTML Project</p>
        </div>
      </div>
    </div>

    <!-- IMAGE 2 -->
    <div class="col-12 col-sm-6 col-md-4">
      <div class="card gallery-card" data-bs-toggle="modal" data-bs-target="#img2">
        <img src="images/gallery2.jpg" class="card-img-top" alt="Gallery Image 2">
        <div class="card-body text-center">
          <p class="card-text">CSS Layout</p>
        </div>
      </div>
    </div>

    <!-- IMAGE 3 -->
    <div class="col-12 col-sm-6 col-md-4">
      <div class="card gallery-card" data-bs-toggle="modal" data-bs-target="#img3">
        <img src="images/gallery3.jpg" class="card-img-top" alt="Gallery Image 3">
        <div class="card-body text-center">
          <p class="card-text">Bootstrap UI</p>
        </div>
      </div>
    </div>

  </div>
</main>

<!-- MODALS -->

<div class="modal fade" id="img1" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <img src="images/gallery1.jpg" class="img-fluid" alt="">
    </div>
  </div>
</div>

<div class="modal fade" id="img2" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <img src="images/gallery2.jpg" class="img-fluid" alt="">
    </div>
  </div>
</div>

<div class="modal fade" id="img3" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <img src="images/gallery3.jpg" class="img-fluid" alt="">
    </div>
  </div>
</div>

<footer class="bg-dark text-white text-center p-3 mt-4">
  © 2025 PLD
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
