<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | PLD</title>

  <link rel="stylesheet" href="css/normalize.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="bg-dark text-white text-center p-3">
  <h1>Dashboard</h1>
</header>

<nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
  <div class="container">
    <a class="navbar-brand" href="#">PLD</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <div class="navbar-nav ms-auto">
        <a class="nav-link active" href="dashboard.html">Dashboard</a>
        <a class="nav-link" href="profile.html">Profile</a>
        <a class="nav-link" href="gallery.html">Gallery</a>
      </div>
    </div>
  </div>
</nav>

<main class="container mt-4">
  <div class="row">

    <div class="col-12 col-md-6 mb-4">
      <div class="card h-100">
        <div class="card-header fw-bold">Topics Explorer</div>
        <div class="card-body">
          <details>
            <summary>Module 1: Web Basics</summary>
            <details class="ms-3 mt-2">
              <summary>Unit 1: HTML</summary>
              <p class="ms-3">HTML Basics</p>
              <p class="ms-3">Semantic Tags</p>
            </details>
            <details class="ms-3 mt-2">
              <summary>Unit 2: CSS</summary>
              <p class="ms-3">Selectors</p>
              <p class="ms-3">Box Model</p>
            </details>
          </details>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-6 mb-4">
      <div class="card h-100">
        <div class="card-header fw-bold">Labs Tracker</div>
        <div class="card-body">
          <p>HTML Basics</p>
          <div class="progress mb-3">
            <div class="progress-bar bg-success w-100">100%</div>
          </div>

          <p>CSS Fundamentals</p>
          <div class="progress mb-3">
            <div class="progress-bar bg-info w-75">75%</div>
          </div>

          <p>Bootstrap UI</p>
          <div class="progress">
            <div class="progress-bar bg-warning text-dark w-50">50%</div>
          </div>
        </div>
      </div>
    </div>

  </div>
</main>

<footer class="bg-dark text-white text-center p-3">
  © 2025 PLD
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
