<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile | PLD</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="bg-dark text-white text-center p-3">
  <h1>User Profile</h1>
</header>

<main class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">

      <div class="card p-4">
        <img src="images/profile.jpg" class="profile-img mb-3" alt="Profile">

        <h4 class="text-center">Your Name</h4>
        <p class="text-center">B.Tech Student</p>

        <h5>Skills</h5>
        <span class="badge bg-primary">HTML</span>
        <span class="badge bg-success">CSS</span>
        <span class="badge bg-warning text-dark">JavaScript</span>

        <p class="mt-3">
          <a href="#" class="link-primary">GitHub Profile</a>
        </p>

        <p>Short professional bio goes here.</p>
      </div>

    </div>
  </div>
</main>

<footer class="bg-dark text-white text-center p-3 mt-4">
  © 2025 PLD
</footer>

</body>
</html>
