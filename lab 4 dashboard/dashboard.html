<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | PLD</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HEADER -->
<header class="bg-dark text-white text-center p-3">
  <h1>Personal Learning Dashboard</h1>
</header>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
  <div class="container">
    <a class="navbar-brand" href="#">PLD</a>
    <div class="navbar-nav">
      <a class="nav-link active" href="dashboard.html">Dashboard</a>
      <a class="nav-link" href="profile.html">Profile</a>
      <a class="nav-link" href="gallery.html">Gallery</a>
    </div>
  </div>
</nav>

<!-- MAIN CONTENT -->
<main class="container mt-4">
  <div class="row">

    <!-- TOPICS EXPLORER -->
    <div class="col-md-6">
      <div class="card mb-4">
        <div class="card-header fw-bold">
          Topics Explorer
        </div>
        <div class="card-body">

          <details>
            <summary>Module 1: Web Basics</summary>

            <details class="ms-3 mt-2">
              <summary>Unit 1: HTML</summary>
              <p class="ms-3 mt-1">Topic: HTML Basics</p>
              <p class="ms-3">Topic: Semantic Tags</p>
            </details>

            <details class="ms-3 mt-2">
              <summary>Unit 2: CSS</summary>
              <p class="ms-3 mt-1">Topic: Selectors</p>
              <p class="ms-3">Topic: Box Model</p>
            </details>

          </details>

        </div>
      </div>
    </div>

    <!-- LABS TRACKER -->
    <div class="col-md-6">
      <div class="card mb-4">
        <div class="card-header fw-bold">
          Labs Tracker
        </div>
        <div class="card-body">

          <p class="mb-1">HTML Basics</p>
          <div class="progress mb-3">
            <div class="progress-bar bg-success" style="width:100%">
              100%
            </div>
          </div>

          <p class="mb-1">CSS Fundamentals</p>
          <div class="progress mb-3">
            <div class="progress-bar bg-info" style="width:75%">
              75%
            </div>
          </div>

          <p class="mb-1">Bootstrap UI</p>
          <div class="progress">
            <div class="progress-bar bg-warning text-dark" style="width:50%">
              50%
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>
</main>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-3 mt-4">
  © 2025 PLD
</footer>

</body>
</html>
